<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Anime levels: TAnimeDirector + 2 worker threads</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>

  <!-- timeline -->
  <text x="40" y="76" font-weight="bold">Shot timeline (each shot comes in and leaves, gap 1.0 .. 2.4 s random)</text>
  <line x1="40" y1="170" x2="1060" y2="170" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="100" width="40" height="60" fill="#eee" stroke="#bbb"/><text x="60" y="135" text-anchor="middle" font-size="11">0.8</text>
  <rect x="80" y="100" width="208" height="60" rx="6" fill="#e8f0ff" stroke="#4a73c9"/>
  <text x="184" y="124" text-anchor="middle" font-weight="bold">Peek 2.6 s</text><text x="184" y="146" text-anchor="middle" fill="#555">corner pop-up, wave, duck</text>
  <rect x="288" y="100" width="120" height="60" fill="#eee" stroke="#bbb"/><text x="348" y="135" text-anchor="middle" font-size="11">gap 1.0 - 2.4</text>
  <rect x="408" y="100" width="208" height="60" rx="6" fill="#e6f6ea" stroke="#3a9a52"/>
  <text x="512" y="124" text-anchor="middle" font-weight="bold">Hop 2.6 s</text><text x="512" y="146" text-anchor="middle" fill="#555">bounce across, squash</text>
  <rect x="616" y="100" width="90" height="60" fill="#eee" stroke="#bbb"/><text x="661" y="135" text-anchor="middle" font-size="11">gap</text>
  <rect x="706" y="100" width="192" height="60" rx="6" fill="#fbe9f3" stroke="#b5427e"/>
  <text x="802" y="124" text-anchor="middle" font-weight="bold">Pop 2.4 s</text><text x="802" y="146" text-anchor="middle" fill="#555">star frame, wink + peace</text>
  <rect x="898" y="100" width="70" height="60" fill="#eee" stroke="#bbb"/>
  <rect x="968" y="100" width="90" height="60" rx="6" fill="#fff4d6" stroke="#c98a1b"/>
  <text x="1013" y="124" text-anchor="middle" font-weight="bold">Side</text><text x="1013" y="146" text-anchor="middle" fill="#555">big face</text>

  <!-- characters -->
  <text x="40" y="214" font-weight="bold">Characters (procedural, no external art)</text>
  <g>
    <rect x="40" y="226" width="240" height="96" rx="8" fill="#f3ecff" stroke="#8a62c9"/>
    <text x="160" y="250" text-anchor="middle" font-weight="bold">Mimi</text>
    <text x="160" y="272" text-anchor="middle" fill="#555">purple cat girl, star clip</text>
    <text x="160" y="292" text-anchor="middle" fill="#555">spiral blush, ring eyes, :3</text>
    <rect x="300" y="226" width="240" height="96" rx="8" fill="#f2efe9" stroke="#8a7a5a"/>
    <text x="420" y="250" text-anchor="middle" font-weight="bold">Kuma</text>
    <text x="420" y="272" text-anchor="middle" fill="#555">bear hood, ^ ^ eyes</text>
    <text x="420" y="292" text-anchor="middle" fill="#555">waves a bear paw</text>
    <rect x="560" y="226" width="240" height="96" rx="8" fill="#eceef4" stroke="#556"/>
    <text x="680" y="250" text-anchor="middle" font-weight="bold">Neko</text>
    <text x="680" y="272" text-anchor="middle" fill="#555">black hair, bow, fang</text>
    <text x="680" y="292" text-anchor="middle" fill="#555">sparkly eyes, waves</text>
    <rect x="820" y="226" width="240" height="96" rx="8" fill="#e8f4ff" stroke="#4a8ac9"/>
    <text x="940" y="250" text-anchor="middle" font-weight="bold">Ao</text>
    <text x="940" y="272" text-anchor="middle" fill="#555">long blue hair, ahoge</text>
    <text x="940" y="292" text-anchor="middle" fill="#555">wink + peace sign</text>
  </g>

  <!-- threads -->
  <text x="40" y="364" font-weight="bold">Drawing pipeline</text>
  <rect x="40" y="378" width="250" height="120" rx="8" fill="#e8f0ff" stroke="#4a73c9"/>
  <text x="165" y="402" text-anchor="middle" font-weight="bold">Director.Update (game thread)</text>
  <text x="55" y="426" fill="#333">picks shot + character</text>
  <text x="55" y="446" fill="#333">moves the layer (CX, CY, W, H)</text>
  <text x="55" y="466" fill="#333">pose: blink, hand, expression</text>
  <text x="55" y="486" fill="#333">requests a frame at 24 fps</text>

  <rect x="350" y="378" width="250" height="120" rx="8" fill="#fff4d6" stroke="#c98a1b"/>
  <text x="475" y="402" text-anchor="middle" font-weight="bold">TAnimeWorker x 2</text>
  <text x="365" y="426" fill="#333">DrawChibi at display size</text>
  <text x="365" y="446" fill="#333">(no rotation, no rescale)</text>
  <text x="365" y="466" fill="#333">double buffer, BmpShot tag</text>
  <text x="365" y="486" fill="#333">so old frames never show</text>

  <rect x="660" y="378" width="400" height="120" rx="8" fill="#fbe9f3" stroke="#b5427e"/>
  <text x="860" y="402" text-anchor="middle" font-weight="bold">DrawWorld / DrawHud</text>
  <text x="675" y="426" fill="#333">chibi drawn at Opacity 90 / 255 (about 35 %)</text>
  <text x="675" y="446" fill="#333">cut-in band + COMBO text: CUTIN_OPACITY 90</text>
  <text x="675" y="466" fill="#333">speed lines on Pop / cut-in</text>
  <text x="675" y="486" fill="#333">Excited = max(combo intensity, cut-in)</text>

  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M290 438 L348 438"/><path d="M600 438 L658 438"/>
  </g>
  <text x="550" y="536" text-anchor="middle" fill="#666">Level fields: anime (None/Mimi/Kuma/Neko/Ao/Party/Image), animeImage (data/anime/), animeCutIn. Measured: 11-14 ms per frame on anime levels.</text>
</svg>
